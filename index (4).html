<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Sürü</title>
<style>
:root{--bg:#0D0B1E;--ink:#F2F0FF;--cy:#3DF0FF;--pk:#FF3D8B;--gd:#FFD23F;--pn:#1A1640;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,'Segoe UI',Roboto,Arial,sans-serif;font-weight:700;overflow:hidden}
#app{position:relative;height:100%;max-width:900px;margin:0 auto}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.ov{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;background:rgba(13,11,30,.9)}
.ov.hide{display:none}
h1{margin:0;font-size:52px;font-weight:800;color:var(--cy);text-shadow:0 0 24px rgba(61,240,255,.55)}
h2{margin:0;font-size:34px;font-weight:800;color:var(--gd)}
p{margin:0;font-size:19px;opacity:.88;max-width:34ch;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer}
.lgb{background:none;border:2px solid #3b3480;border-radius:12px;padding:6px 14px;font-size:16px}
.go{font-size:26px;border:0;border-radius:16px;padding:14px 38px;background:var(--cy);color:#0D0B1E;box-shadow:0 0 22px rgba(61,240,255,.4)}
.go:active{transform:translateY(2px)}
#cards{display:flex;flex-direction:column;gap:10px;width:min(360px,100%)}
.card{background:var(--pn);border:2px solid #3b3480;border-radius:16px;padding:12px 16px;text-align:left;font-size:20px}
.card small{display:block;font-size:15px;opacity:.8;margin-top:2px}
.card:hover,.card:focus-visible{border-color:var(--cy);outline:none}
#mute{position:absolute;right:10px;bottom:10px;z-index:4;background:rgba(26,22,64,.8);border:0;border-radius:12px;padding:6px 10px;font-size:20px}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <button id="mute" aria-label="Sesi aç/kapat">🔊</button>
  <div class="ov" id="menu">
    <h1>Neon Sürü</h1>
    <p id="mt"></p>
    <p id="best"></p>
    <button class="go" id="start"></button><button class="lgb" id="lg" aria-label="Language"></button>
  </div>
  <div class="ov hide" id="lvl"><h2 id="lh"></h2><p id="lp"></p><div id="cards"></div></div>
  <div class="ov hide" id="end"><h1 id="et" style="color:var(--pk);text-shadow:0 0 24px rgba(255,61,139,.5)"></h1><p id="es"></p><button class="go" id="again"></button></div>
</div>
<script>
const $=id=>document.getElementById(id),app=$('app'),cv=$('c'),cx=cv.getContext('2d');
let W,H,D=1,G=null,run=false,muted=false,ac=null,best=0,last=0;
try{best=+localStorage.getItem('neon-best')||0}catch(e){}
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const T={
 tr:{mt:'Parmağını sürükleyerek hareket et (bilgisayarda WASD / oklar). Ateş otomatik. Düşmanları vur, parlayan kristalleri topla, seviye atladıkça güçlen.',st:'Başla',ag:'Tekrar dene',et:'Yenildin',lh:'Seviye atladın!',lp:'Bir yükseltme seç',bst:'En uzun hayatta kalma: ',rec:'Yeni rekor!',time:'Süre',en:'düşman',lv:'Seviye',sv:'Sv.',bs:'BOSS GELİYOR!',cs:'Sandık!',bd:'Boss yenildi!',
  up:[['Güç','Mermi hasarı +35%'],['Seri atış','Ateş hızı +25%'],['Çoklu atış','+1 mermi'],['Delici','Mermiler +1 düşmandan geçer'],['Çeviklik','Hareket hızı +12%'],['Mıknatıs','Kristal çekim alanı +50%'],['Zırh','Maks. can +25 ve 40 can yenilenir'],['Şok dalgası','Etrafındaki düşmanlara periyodik hasar verir ve iter'],['Yenilenme','Zamanla can yeniler']]},
 en:{mt:'Drag your finger to move (WASD / arrow keys on desktop). Shooting is automatic. Defeat enemies, collect glowing crystals and get stronger as you level up.',st:'Play',ag:'Try again',et:'You lost',lh:'Level up!',lp:'Choose an upgrade',bst:'Longest survival: ',rec:'New record!',time:'Time',en:'enemies',lv:'Level',sv:'Lv.',bs:'BOSS INCOMING!',cs:'Chest!',bd:'Boss defeated!',
  up:[['Power','Bullet damage +35%'],['Rapid fire','Fire rate +25%'],['Multishot','+1 bullet'],['Piercing','Bullets pass through +1 enemy'],['Agility','Move speed +12%'],['Magnet','Crystal pickup range +50%'],['Armor','Max HP +25 and heal 40'],['Shockwave','Periodically damages and pushes back nearby enemies'],['Regeneration','Slowly restores health']]}};
let lang=(navigator.language||'').toLowerCase().startsWith('tr')?'tr':'en';
try{lang=localStorage.getItem('neon-lang')||lang}catch(e){}
function ui(){const t=T[lang];document.documentElement.lang=lang;$('mt').textContent=t.mt;$('start').textContent=t.st;$('again').textContent=t.ag;$('et').textContent=t.et;$('lh').textContent=t.lh;$('lp').textContent=t.lp;$('best').textContent=best?t.bst+fmt(best):'';$('lg').textContent=lang==='tr'?'English':'Türkçe'}
$('lg').onclick=()=>{lang=lang==='tr'?'en':'tr';try{localStorage.setItem('neon-lang',lang)}catch(e){}ui()};
ui();
function rs(){D=Math.min(devicePixelRatio||1,2);W=app.clientWidth;H=app.clientHeight;cv.width=W*D;cv.height=H*D;cx.setTransform(D,0,0,D,0,0)}
addEventListener('resize',rs);rs();

/* ses */
function snd(f,d=.1,ty='sine',v=.08,to=null,at=0){if(muted||!ac)return;const t=ac.currentTime+at,o=ac.createOscillator(),g=ac.createGain();
 o.type=ty;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
 o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02)}
const S={kill:()=>snd(300+Math.random()*120,.09,'triangle',.07,120),gem:()=>snd(900+Math.random()*200,.06,'sine',.05),hurt:()=>snd(140,.25,'sawtooth',.12,60),
 up:()=>[523,659,784,1046].forEach((f,i)=>snd(f,.14,'square',.06,null,i*.08)),over:()=>[400,300,220,140].forEach((f,i)=>snd(f,.25,'triangle',.12,null,i*.15))};

/* yükseltmeler */
const UP=[
 {n:'Güç',d:'Mermi hasarı +35%',f:s=>s.dmg*=1.35},
 {n:'Seri atış',d:'Ateş hızı +25%',f:s=>s.rate*=1.25},
 {n:'Çoklu atış',d:'+1 mermi',f:s=>s.multi++,max:5},
 {n:'Delici',d:'Mermiler +1 düşmandan geçer',f:s=>s.pierce++,max:4},
 {n:'Çeviklik',d:'Hareket hızı +12%',f:s=>s.speed*=1.12,max:5},
 {n:'Mıknatıs',d:'Kristal çekim alanı +50%',f:s=>s.mag*=1.5,max:4},
 {n:'Zırh',d:'',f:(s,p)=>{p.max+=25;p.hp=Math.min(p.max,p.hp+40)}},
 {n:'Şok dalgası',d:'',f:s=>s.nova++,max:4},
 {n:'Yenilenme',d:'',f:s=>s.regen+=.6,max:4}];

function init(){G={t:0,kills:0,lvl:1,xp:0,need:4,sp:0,cd:0,sh:0,pause:false,
 p:{x:0,y:0,hp:100,max:100,iv:0,fx:1,fy:0},st:{dmg:1.7,rate:2.6,multi:1,pierce:0,speed:210,mag:90,nova:0,regen:0},
 en:[],bu:[],gm:[],pt:[],up:{},eb:[],ch:[],nv:4,msg:'',mt:0,boss:null}}
init();

/* girdi */
const keys={};let jy=null;
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
cv.addEventListener('pointerdown',e=>{jy={x:e.offsetX,y:e.offsetY,cx:e.offsetX,cy:e.offsetY,id:e.pointerId};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(jy&&e.pointerId===jy.id){jy.cx=e.offsetX;jy.cy=e.offsetY}});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>jy=null));
function input(){let x=0,y=0;
 if(jy){const dx=jy.cx-jy.x,dy=jy.cy-jy.y,d=Math.hypot(dx,dy);if(d>8){const m=Math.min(d,60)/60;x=dx/d*m;y=dy/d*m}}
 else{x=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);y=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}}
 return[x,y]}

/* oyun mantığı */
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=40+Math.random()*140;G.pt.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5,c})}}
function spawn(){
 const t=G.t,s=1+t/90,a=Math.random()*6.28,R=Math.max(W,H)*.6,r=Math.random();
 let k={hp:3*s,sp:70,r:12,c:'#FF3D8B',v:1,ty:0};
 if(t>40&&r<.18)k={hp:2*s,sp:105,r:10,c:'#FFA23D',v:1,ty:1};
 else if(t>55&&r>.88)k={hp:15*s,sp:44,r:22,c:'#9B5CFF',v:4,ty:2};
 G.en.push({...k,mh:k.hp,x:G.p.x+Math.cos(a)*R,y:G.p.y+Math.sin(a)*R,kx:0,ky:0,f:0})}

function rebase(){const g=G,p=g.p,dx=Math.abs(p.x)>1024?Math.round(p.x/64)*64:0,dy=Math.abs(p.y)>1024?Math.round(p.y/64)*64:0;
 if(!dx&&!dy)return;for(const a of[g.en,g.bu,g.gm,g.pt,g.eb,g.ch,[p]])for(const o of a){o.x-=dx;o.y-=dy}}
function upd(dt){
 const g=G,p=g.p,st=g.st;g.t+=dt;g.sh=Math.max(0,g.sh-dt*30);p.iv-=dt;
 const[ix,iy]=input();p.x+=ix*st.speed*dt;p.y+=iy*st.speed*dt;if(ix||iy){p.fx=ix;p.fy=iy}rebase();
 g.sp-=dt;if(g.sp<=0&&g.en.length<90){const n=1+Math.floor(g.t/90);for(let i=0;i<n;i++)spawn();g.sp=Math.max(.45,1.3-g.t*.003)}
 /* otomatik ateş */
 g.cd-=dt;if(g.cd<=0&&g.en.length){let b=null,bd=1e9;for(const e of g.en){const d=(e.x-p.x)**2+(e.y-p.y)**2;if(d<bd){bd=d;b=e}}
  if(bd<460*460){const a0=Math.atan2(b.y-p.y,b.x-p.x);for(let i=0;i<st.multi;i++){const a=a0+(i-(st.multi-1)/2)*.17;
   g.bu.push({x:p.x,y:p.y,vx:Math.cos(a)*540,vy:Math.sin(a)*540,l:1.1,pr:st.pierce,h:[]})}g.cd=1/st.rate;snd(700,.04,'square',.02,400)}}
 /* mermiler */
 for(const b of g.bu){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;
  for(const e of g.en){if(b.l<=0)break;if(b.h.includes(e))continue;
   if((e.x-b.x)**2+(e.y-b.y)**2<(e.r+5)**2){b.h.push(e);e.hp-=st.dmg;e.f=.08;const d=Math.hypot(b.vx,b.vy);e.kx=b.vx/d*90;e.ky=b.vy/d*90;if(b.pr--<=0)b.l=0}}}
 g.bu=g.bu.filter(b=>b.l>0);
 /* düşmanlar */
 for(const e of g.en){const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;
  e.x+=(dx/d*e.sp+e.kx)*dt;e.y+=(dy/d*e.sp+e.ky)*dt;e.kx*=.9;e.ky*=.9;e.f-=dt;
  if(e.boss){e.cd-=dt;if(e.cd<=0){e.cd=2.2;for(let i=0;i<10;i++){const a=i/10*6.283+g.t;g.eb.push({x:e.x,y:e.y,vx:Math.cos(a)*170,vy:Math.sin(a)*170,l:4})}}}
  if(d<e.r+13&&p.iv<=0){p.hp-=e.ty===3?22:e.ty===2?18:10;p.iv=.6;g.sh=8;S.hurt()}}
 for(let i=0;i<g.en.length;i++)for(let j=i+1;j<g.en.length;j++){const a=g.en[i],b=g.en[j],dx=b.x-a.x,dy=b.y-a.y,m=a.r+b.r;
  if(dx*dx+dy*dy<m*m){const d=Math.hypot(dx,dy)||1,o=(m-d)*.5*.5;a.x-=dx/d*o;a.y-=dy/d*o;b.x+=dx/d*o;b.y+=dy/d*o}}
 for(const e of g.en)if(e.hp<=0){g.kills++;g.gm.push({x:e.x,y:e.y,v:e.v});g.xp+=e.v*.4;burst(e.x,e.y,e.c,e.boss?40:e.ty===2?16:8);S.kill();
  if(e.boss){g.ch.push({x:e.x,y:e.y});g.boss=null;g.msg=T[lang].bd;g.mt=2.5;g.eb=[]}else if(e.ty===2&&Math.random()<.12)g.ch.push({x:e.x,y:e.y})}
 g.en=g.en.filter(e=>e.hp>0);
 for(const b of g.eb){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;if(p.iv<=0&&(b.x-p.x)**2+(b.y-p.y)**2<441){p.hp-=12;p.iv=.6;g.sh=8;b.l=0;S.hurt()}}
 g.eb=g.eb.filter(b=>b.l>0);
 for(const c of g.ch)if((c.x-p.x)**2+(c.y-p.y)**2<676){c.got=1;levelUp(true)}
 g.ch=g.ch.filter(c=>!c.got);
 if(st.regen)p.hp=Math.min(p.max,p.hp+st.regen*dt);
 if(st.nova){g.nv-=dt;if(g.nv<=0){g.nv=4.5-st.nova*.4;const R=80+st.nova*30;g.nvR=R;g.nvT=.35;
  for(const e of g.en){const dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy)||1;if(d<R+e.r){e.hp-=3*st.nova*st.dmg;e.f=.1;e.kx=dx/d*220;e.ky=dy/d*220}}snd(200,.3,'sawtooth',.06,500)}}
 g.nvT=Math.max(0,(g.nvT||0)-dt);g.mt=Math.max(0,g.mt-dt);
 /* kristaller */
 for(const m of g.gm){const dx=p.x-m.x,dy=p.y-m.y,d=Math.hypot(dx,dy);
  if(d<st.mag||m.pull){m.pull=1;m.x+=dx/d*360*dt;m.y+=dy/d*360*dt}
  if(d<16){g.xp+=m.v;m.v=0;S.gem()}}
 g.gm=g.gm.filter(m=>m.v>0);
 for(const q of g.pt){q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt}g.pt=g.pt.filter(q=>q.l>0);
 if(g.xp>=g.need){g.xp-=g.need;g.lvl++;g.need=Math.floor(g.need*1.25+2);levelUp();if(g.lvl%5===0&&!g.boss)spawnBoss()}
 if(p.hp<=0)over();
}

function spawnBoss(){const g=G,p=g.p,a=Math.random()*6.28,R=Math.max(W,H)*.6,k=g.lvl/5,h=70*k*k+50*k;
 g.boss={x:p.x+Math.cos(a)*R,y:p.y+Math.sin(a)*R,hp:h,mh:h,sp:50,r:38,c:'#FF5A2A',v:20,ty:3,kx:0,ky:0,f:0,cd:2,boss:1};
 g.en.push(g.boss);g.msg=T[lang].bs;g.mt=2.5}
function levelUp(ch){if(ch){G.p.hp=Math.min(G.p.max,G.p.hp+30);$('lh').textContent=T[lang].cs}else $('lh').textContent=T[lang].lh;
 G.pause=true;S.up();const box=$('cards');box.innerHTML='';
 const pool=UP.filter(u=>!u.max||(G.up[u.n]||0)<u.max).sort(()=>Math.random()-.5).slice(0,3);
 for(const u of pool){const b=document.createElement('button');b.className='card';
  const tx=T[lang].up[UP.indexOf(u)];b.innerHTML=tx[0]+' <small>'+tx[1]+(G.up[u.n]?' ('+T[lang].sv+' '+G.up[u.n]+' → '+(G.up[u.n]+1)+')':'')+'</small>';
  b.onclick=()=>{u.f(G.st,G.p);G.up[u.n]=(G.up[u.n]||0)+1;$('lvl').classList.add('hide');G.pause=false};box.appendChild(b)}
 $('lvl').classList.remove('hide')}

function over(){
 run=false;S.over();let note='';
 if(G.t>best){best=G.t;note=' '+T[lang].rec;try{localStorage.setItem('neon-best',String(best))}catch(e){}}
 $('es').textContent=T[lang].time+' '+fmt(G.t)+' · '+G.kills+' '+T[lang].en+' · '+T[lang].lv+' '+G.lvl+'.'+note;
 $('best').textContent=T[lang].bst+fmt(best);$('end').classList.remove('hide')}

function begin(){
 if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();
 init();run=true;$('menu').classList.add('hide');$('end').classList.add('hide');$('lvl').classList.add('hide')}

/* çizim */
function poly(x,y,r,n,rot){cx.beginPath();for(let i=0;i<n;i++){const a=rot+i*6.283/n;i?cx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r):cx.moveTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}cx.closePath()}
function draw(){
 const g=G,p=g.p;cx.setTransform(D,0,0,D,0,0);cx.globalAlpha=1;cx.globalCompositeOperation='source-over';cx.shadowBlur=0;cx.fillStyle='#0D0B1E';cx.fillRect(0,0,W,H);
 const sx=g.sh?(Math.random()-.5)*g.sh:0,sy=g.sh?(Math.random()-.5)*g.sh:0;
 cx.save();cx.translate(W/2-p.x+sx,H/2-p.y+sy);
 cx.strokeStyle='rgba(120,100,255,.13)';cx.lineWidth=1;cx.beginPath();
 const x0=Math.floor((p.x-W/2)/64)*64,y0=Math.floor((p.y-H/2)/64)*64;
 for(let x=x0;x<=p.x+W/2+64;x+=64){cx.moveTo(x,p.y-H/2-64);cx.lineTo(x,p.y+H/2+64)}
 for(let y=y0;y<=p.y+H/2+64;y+=64){cx.moveTo(p.x-W/2-64,y);cx.lineTo(p.x+W/2+64,y)}cx.stroke();
 for(const m of g.gm){cx.fillStyle='#5CFFB0';poly(m.x,m.y,m.v>1?8:6,4,.78);cx.fill()}
 for(const c of g.ch){cx.fillStyle='#FFB000';cx.fillRect(c.x-14,c.y-10,28,20);cx.fillStyle='#7A4A00';cx.fillRect(c.x-14,c.y-2,28,4);cx.fillStyle='#fff';cx.fillRect(c.x-3,c.y-4,6,8)}
 for(const b of g.eb){cx.fillStyle='#FF5A2A';cx.beginPath();cx.arc(b.x,b.y,7,0,6.283);cx.fill()}
 for(const e of g.en){cx.fillStyle=e.f>0?'#fff':e.c;const a=Math.atan2(p.y-e.y,p.x-e.x);
  if(e.ty===0){cx.beginPath();cx.arc(e.x,e.y,e.r,0,6.283)}else poly(e.x,e.y,e.r,e.ty===1?3:e.ty===3?8:6,e.ty===1?a:0);cx.fill();
  if(e.ty===2&&e.hp<e.mh){cx.fillStyle='rgba(255,255,255,.7)';cx.fillRect(e.x-16,e.y-e.r-8,32*e.hp/e.mh,3)}}
 cx.globalCompositeOperation='lighter';
 for(const b of g.bu){cx.fillStyle='#FFD23F';cx.beginPath();cx.arc(b.x,b.y,5,0,6.283);cx.fill();cx.fillStyle='rgba(255,210,63,.25)';cx.beginPath();cx.arc(b.x,b.y,10,0,6.283);cx.fill()}
 for(const q of g.pt){cx.globalAlpha=Math.max(0,q.l*2);cx.fillStyle=q.c;cx.fillRect(q.x-2,q.y-2,4,4)}cx.globalAlpha=1;
 cx.globalCompositeOperation='source-over';
 const bl=p.iv>0&&Math.floor(p.iv*20)%2;cx.fillStyle=bl?'#fff':'#3DF0FF';cx.shadowColor='#3DF0FF';cx.shadowBlur=18;
 cx.beginPath();cx.arc(p.x,p.y,14,0,6.283);cx.fill();cx.shadowBlur=0;cx.strokeStyle='#fff';cx.lineWidth=2;cx.stroke();
 cx.fillStyle='#0D0B1E';cx.beginPath();cx.arc(p.x+p.fx*6,p.y+p.fy*6,4,0,6.283);cx.fill();
 cx.restore();
 if(g.nvT>0){cx.strokeStyle='rgba(61,240,255,'+(g.nvT*2)+')';cx.lineWidth=4;cx.beginPath();cx.arc(W/2,H/2,g.nvR*(1.15-g.nvT),0,6.283);cx.stroke()}
 /* joystick */
 if(jy&&run){cx.strokeStyle='rgba(61,240,255,.35)';cx.lineWidth=3;cx.beginPath();cx.arc(jy.x,jy.y,60,0,6.283);cx.stroke();
  const dx=jy.cx-jy.x,dy=jy.cy-jy.y,d=Math.min(Math.hypot(dx,dy),60)||0,a=Math.atan2(dy,dx);
  cx.fillStyle='rgba(61,240,255,.5)';cx.beginPath();cx.arc(jy.x+Math.cos(a)*d,jy.y+Math.sin(a)*d,22,0,6.283);cx.fill()}
 /* HUD */
 cx.fillStyle='rgba(255,255,255,.12)';cx.fillRect(0,0,W,8);cx.fillStyle='#5CFFB0';cx.fillRect(0,0,W*g.xp/g.need,8);
 cx.fillStyle='rgba(255,255,255,.15)';cx.fillRect(14,20,140,12);cx.fillStyle=p.hp/p.max>.3?'#FF3D8B':'#ff2020';cx.fillRect(14,20,140*Math.max(0,p.hp)/p.max,12);

function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
 try{const p=G.p;if(!isFinite(p.x+p.y)){p.x=0;p.y=0}if(run&&!G.pause)upd(dt);draw()}catch(e){console.error(e);cx.setTransform(D,0,0,D,0,0)}
 requestAnimationFrame(loop)}
